name: Build release JAR

on:
  push:
    branches: [master, timed-wands]
  pull_request:
    branches: [master, timed-wands]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile, check and package plugin
        run: python scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AxSellwands-timed
          path: |
            target/AxSellwands-*.jar
            target/AxSellwands-*.jar.sha256
          if-no-files-found: error
